name: Publish Neurally There

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy static PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify lessons and lab
        run: node tests/smoke.mjs

      - name: Assemble public files only
        run: |
          mkdir -p dist/src dist/assets
          cp index.html styles.css sw.js manifest.webmanifest dist/
          cp src/app.js src/content.js dist/src/
          cp assets/favicon.svg assets/icon-192.png assets/icon-512.png dist/assets/
          touch dist/.nojekyll
          test -s dist/index.html && test -s dist/src/app.js && test -s dist/src/content.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
