name: Import v0.1 assets
on:
  push:
    paths:
      - 'bootstrap/neurally-v0.1.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source files
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          payload = ''.join(p.read_text().strip() for p in sorted(pathlib.Path("bootstrap").glob("part-*.txt")))
          entries = json.loads(zlib.decompress(base64.b64decode(payload)))
          for relative, entry in entries.items():
              target = pathlib.Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              if "text" in entry:
                  target.write_text(entry["text"], encoding="utf-8")
              else:
                  target.write_bytes(base64.b64decode(entry["binary"]))
          PY
          rm -rf bootstrap/
          rm -f .github/workflows/import-v0.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import full Neurally There v0.1 application"
            git push
          fi
